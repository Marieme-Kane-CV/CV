<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mon CV</title>
  <style>
    /* Supprime les marges et padding du body et html pour full screen */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center; /* centre horizontalement */
      align-items: center;     /* centre verticalement */
      background-color: #f0f0f0; /* couleur de fond */
    }

    /* Image qui prend tout l'écran sans déformer le ratio */
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* garde les proportions */
      box-shadow: 2px 2px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <img src="CV%20generale.pdf" alt="CV de Kane">

</body>
</html>
